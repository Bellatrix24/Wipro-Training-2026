version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"

  api:
    build: ./api
    container_name: contact-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/contactdb
    depends_on:
      - mongodb
    restart: always

  client:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=http://localhost:5000
    container_name: contact-client
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always
